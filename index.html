<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomas do Brasil</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .popup-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([-15, -55], 4);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap Contributors'
    }
).addTo(map);

fetch('./BiomasdoBrasil.geojson')
    .then(response => {
        if (!response.ok) {
            throw new Error('Erro ao carregar BiomasdoBrasil.geojson');
        }
        return response.json();
    })
    .then(data => {

        const layer = L.geoJSON(data, {

            style: function(feature) {
                return {
                    color: '#333333',
                    weight: 1,
                    fillOpacity: 0.5
                };
            },

            onEachFeature: function(feature, layer) {

                let popup = '';

                if (feature.properties) {

                    if (feature.properties.name) {
                        popup += '<div class="popup-title">' +
                                 feature.properties.name +
                                 '</div>';
                    }

                    if (feature.properties.description) {
                        popup += feature.properties.description;
                    }

                    if (!popup) {
                        popup = Object.entries(feature.properties)
                            .map(([k,v]) => '<b>' + k + '</b>: ' + v)
                            .join('<br>');
                    }
                }

                if (popup) {
                    layer.bindPopup(popup);
                }
            }

        }).addTo(map);

        if (layer.getBounds().isValid()) {
            map.fitBounds(layer.getBounds());
        }
    })
    .catch(error => {
        console.error(error);
        alert('Erro ao carregar o arquivo BiomasdoBrasil.geojson.');
    });
</script>

</body>
</html>
