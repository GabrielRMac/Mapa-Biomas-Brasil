<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Biomas do Brasil</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,
body {

    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;

}

#map {

    width: 100%;
    height: 100vh;

}

.legend {

    background: white;

    padding: 12px;

    border-radius: 10px;

    box-shadow:
        0 0 10px rgba(0,0,0,.25);

    line-height: 24px;

}

.legend h4 {

    margin: 0 0 10px 0;

}

.legend i {

    width: 18px;

    height: 18px;

    float: left;

    margin-right: 8px;

    opacity: .95;

}

.popup-card {

    min-width: 220px;

    max-width: 320px;

}

.popup-title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 8px;

}

.popup-section {

    margin-top: 8px;

}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map =
    L.map('map')
     .setView(
        [-15, -55],
        4
     );

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:
            '&copy; OpenStreetMap Contributors'
    }
).addTo(map);

let geoLayer;

const biomasInfo = {

    "Amazônia": {

        descricao:
            "Maior bioma do Brasil e maior floresta tropical do planeta."

    },

    "Cerrado": {

        descricao:
            "Maior savana da América do Sul e importante berço das águas brasileiras."

    },

    "Caatinga": {

        descricao:
            "Único bioma exclusivamente brasileiro, adaptado ao clima semiárido."

    },

    "Mata Atlântica": {

        descricao:
            "Uma das florestas mais biodiversas e ameaçadas do mundo."

    },

    "Pantanal": {

        descricao:
            "Maior área úmida continental do planeta."

    },

    "Pampa": {

        descricao:
            "Bioma de campos naturais predominante no sul do Brasil."

    }

};

function highlightFeature(e) {

    const layer = e.target;

    layer.setStyle({

        weight: 4,

        color: '#000000',

        fillOpacity: 0.8

    });

    layer.bringToFront();

}

function resetHighlight(e) {

    geoLayer.resetStyle(
        e.target
    );

}

function zoomToFeature(e) {

    map.fitBounds(
        e.target.getBounds()
    );

}

fetch('./BiomasdoBrasil.geojson')

.then(response => response.json())

.then(data => {

    geoLayer = L.geoJSON(data, {

        style: function(feature) {

            const p =
                feature.properties || {};

            return {

                color:
                    p.stroke || '#333333',

                weight:
                    p['stroke-width'] || 1,

                opacity:
                    p['stroke-opacity'] || 1,

                fillColor:
                    p.fill || '#999999',

                fillOpacity:
                    p['fill-opacity'] || 0.5

            };

        },

        onEachFeature:
        function(feature, layer) {

            const p =
                feature.properties || {};

            const info =
                biomasInfo[p.Bioma];

            let popup =

            `
            <div class="popup-card">

                <div
                    class="popup-title"
                    style="
                        color:${p.stroke || '#333'};
                    ">

                    ${p.name || p.Bioma}

                </div>

                <div>

                    <b>Bioma:</b>
                    ${p.Bioma || '-'}

                </div>

                <div>

                    <b>Código:</b>
                    ${p.CD_Bioma || '-'}

                </div>
            `;

            if(info){

                popup +=

                `
                <div class="popup-section">

                    ${info.descricao}

                </div>
                `;
            }

            popup +=
            `
            </div>
            `;

            layer.bindPopup(
                popup
            );

            layer.on({

                mouseover:
                    highlightFeature,

                mouseout:
                    resetHighlight,

                click:
                    zoomToFeature

            });

        }

    }).addTo(map);

    if(
        geoLayer
            .getBounds()
            .isValid()
    ){

        map.fitBounds(
            geoLayer.getBounds()
        );

    }

})

.catch(error => {

    console.error(
        'Erro ao carregar GeoJSON:',
        error
    );

});

const legenda =
    L.control({

        position:
            'bottomright'

    });

legenda.onAdd = function() {

    const div =
        L.DomUtil.create(
            'div',
            'legend'
        );

    div.innerHTML = `

        <h4>Biomas</h4>

        <div>
            <i style="background:#5A9F71"></i>
            Amazônia
        </div>

        <div>
            <i style="background:#F4D3B0"></i>
            Cerrado
        </div>

        <div>
            <i style="background:#EFE39A"></i>
            Caatinga
        </div>

        <div>
            <i style="background:#F2C1C1"></i>
            Mata Atlântica
        </div>

        <div>
            <i style="background:#8B6B5A"></i>
            Pantanal
        </div>

        <div>
            <i style="background:#7FA9D9"></i>
            Pampa
        </div>

    `;

    return div;

};

legenda.addTo(map);

</script>

</body>

</html>
